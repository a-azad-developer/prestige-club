version: "3.9"

services:
  db:
    image: postgres:18-alpine
    container_name: prestige-club-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-prestige_club}
    # Mount the parent directory so PG 18+ can create a version-specific
    # subdirectory (e.g. /var/lib/postgresql/18/data). This is required for
    # pg_upgrade --link compatibility across major version bumps.
    # See https://github.com/docker-library/postgres/pull/1259
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-prestige_club}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: prestige-club-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:${DB_PORT:-5432}/${DB_NAME:-prestige_club}?schema=public"
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-prestige_club}
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
